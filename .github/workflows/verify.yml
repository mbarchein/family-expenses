name: verify

# Everything that can say "no" before anything is published.
#
# Deliberately a separate workflow from `deploy.yml` rather than its first
# job: a pull request needs the checks and must never reach the deploy step, and
# a workflow that does both ends up guarding the second half with an `if` that
# is one edit away from being wrong.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

      # The build needs these to exist, not to be right: Vite inlines them at
      # build time and an undefined one becomes the string "undefined" in the
      # bundle rather than a failure anyone would notice. The real values reach
      # the deploy from Actions variables; these are here so the build is
      # exercised.
      - run: npm run build
        env:
          VITE_API_URL: https://example.invalid/exec
          VITE_GOOGLE_CLIENT_ID: ci.apps.googleusercontent.com
          VITE_CONTACT_EMAIL: ci@example.invalid

  # The bundle, in a browser, at the size of a phone. Everything this job has
  # caught so far was invisible to the other two: a screen that scrolled because
  # the layout was written for a document, and a sign-in button whose credential
  # arrived after the request that wanted it had given up. Google and the
  # backend are stubbed, so it touches no network and writes to no spreadsheet.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # Chromium alone. Every assertion here is about a phone-shaped viewport,
      # and three engines would triple the minutes to test the same thing. The
      # day this app has a Safari-only bug is the day to add webkit.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Parsing every file catches the mistake that happens most: a typo pushed
      # with clasp, discovered by a phone that suddenly cannot save.
      - name: Parse the Apps Script sources
        run: for file in apps-script/*.js; do node --check "$file"; done

      # And then run it. This used to say Apps Script had no test runner
      # reachable from CI, which was true of Google's runtime and not of the
      # code: the sources are plain JavaScript, so forty lines of fakes make
      # `handleBootstrap_` callable in Node. What that covers is the gap the
      # browser tests structurally cannot — they stub the API, so a backend
      # that throws, or answers a shape the app does not expect, stays green
      # all the way to somebody's phone.
      - name: Run the Apps Script sources against fake sheets
        run: node --test "apps-script/test/*.test.js"

      # What actually gets pushed, asked of clasp itself.
      #
      # The test files above are Node: their first line is `require('node:test')`.
      # They were pushed to Google along with the sources for one afternoon,
      # because nothing said not to — and Apps Script runs the top level of every
      # file in a project on every request, so every call died with
      # "ReferenceError: require is not defined" before reaching doPost. The web
      # app answered an HTML error page, the browser reported
      # `TypeError: Failed to fetch`, and the app was unopenable while all three
      # jobs of this workflow stayed green.
      #
      # `clasp status` resolves .claspignore the same way `clasp push` does, which
      # is the point: a check that reimplemented those rules could disagree with
      # the deploy, which is the bug all over again. No token needed — the script
      # id is a dummy, because nothing here talks to Google.
      - name: Check clasp would push only what Apps Script can run
        run: |
          printf '{"scriptId":"verify-only","rootDir":"./apps-script"}' > .clasp.json
          npx --yes @google/clasp@2 status --json > push.json
          node -e '
            const { filesToPush } = require("./push.json");
            const fs = require("node:fs");
            console.log("clasp would push:\n  " + filesToPush.join("\n  "));

            const strays = filesToPush.filter(f => !/^apps-script\/[^/]+\.(js|json)$/.test(f));
            if (strays.length) {
              console.error("::error::Not a backend source: " + strays.join(", ")
                + ". Apps Script compiles every file in the project; add it to .claspignore.");
              process.exit(1);
            }

            // Node-only syntax in a file bound for Apps Script. `require` at the
            // top level of any pushed file breaks every request to the web app,
            // not just the file it is in.
            const nodeisms = filesToPush.filter(f => f.endsWith(".js")
              && /\brequire\s*\(|\bmodule\.exports\b/.test(fs.readFileSync(f, "utf8")));
            if (nodeisms.length) {
              console.error("::error::Node syntax in a file clasp pushes: " + nodeisms.join(", ")
                + ". Apps Script has no require(); this would break every request.");
              process.exit(1);
            }
            console.log("All " + filesToPush.length + " are files Apps Script can run.");
          '
