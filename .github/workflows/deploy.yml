name: deploy

# Publishes the app and the backend, both on every run.
#
# Gated on `verify`: Vercel's own Git integration would deploy every push the
# moment it lands, checks or no checks, so it stays DISCONNECTED and the deploy
# happens here instead. If you ever reconnect it, this workflow becomes a second
# deployment racing the first — see DEPLOY.md §7.
#
# The frontend and the backend are separate jobs on purpose. They fail for
# unrelated reasons (a Vercel token that expired; a clasp session that did), and
# a red frontend deploy must not leave the spreadsheet half-updated.

on:
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Serialized and never cancelled: a deploy interrupted halfway is worse than a
# deploy that waits.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  # Which halves of the deployment are actually configured.
  #
  # Until someone has sat down and walked through DEPLOY.md, none of the secrets
  # exist and both jobs below would fail on every single push. A deploy workflow
  # that is permanently red is worse than one that does nothing: it teaches
  # everyone to ignore the red mark, and the day something real breaks nobody
  # looks. So the jobs are skipped, loudly, with a notice saying what is missing.
  #
  # This has to be a job rather than an `if` on each one: the `secrets` context
  # is not available in a job-level `if`, only inside steps.
  #
  # Most of what is checked here is a `vars` rather than a secret. Anything that
  # ends up inside the published bundle — the OAuth client id, the backend URL —
  # is public the moment the app loads, so storing it as a secret would hide it
  # from us and from nobody else. Both are created by infra/, not by hand.
  preflight:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      vercel: ${{ steps.check.outputs.vercel }}
      clasp: ${{ steps.check.outputs.clasp }}
    steps:
      - id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          SCRIPT_ID: ${{ vars.SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          # Which commit the phone is actually running, printed in the details
          # panel behind a failure. Not a nicety: "antes funcionaba" is a claim
          # about two versions, and without this there is no way to tell from the
          # phone which of them is on it — including whether it ever picked up
          # the fix it is being asked about. A local or CI build says 'dev'.
          VITE_BUILD: ${{ github.sha }}
          # Printed on the two legal pages. Absent, they say so rather than
          # showing a gap — which is why preflight does not gate on it: a
          # missing contact address is not a reason to refuse to publish.
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
        run: |
          vercel=true
          clasp=true
          [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ] \
            && [ -n "$VITE_API_URL" ] && [ -n "$VITE_GOOGLE_CLIENT_ID" ] || vercel=false
          [ -n "$CLASPRC_JSON" ] && [ -n "$SCRIPT_ID" ] && [ -n "$DEPLOYMENT_ID" ] || clasp=false

          echo "vercel=$vercel" >> "$GITHUB_OUTPUT"
          echo "clasp=$clasp" >> "$GITHUB_OUTPUT"

          if [ "$vercel" = false ] || [ "$clasp" = false ]; then
            echo "::notice::Not deploying yet — app:$vercel backend:$clasp. Add the missing secrets, DEPLOY.md §7."
            {
              echo "### Nothing deployed"
              echo
              echo "| Half | Configured |"
              echo "| --- | --- |"
              echo "| App (Vercel) | \`$vercel\` |"
              echo "| Backend (clasp) | \`$clasp\` |"
              echo
              echo "Run terraform apply in [infra/](../blob/main/infra), or see DEPLOY.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  app:
    needs: preflight
    if: needs.preflight.outputs.vercel == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://gafa.terragiro.es
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      # A workflow_run checks out the default branch's tip by default, not the
      # commit that was verified. Two pushes landing close together would
      # otherwise deploy the second one twice and the first never.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm install --global vercel@latest

      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Built here rather than by Vercel so the bundle that ships is the one
      # this workflow verified, from this commit.
      #
      # The VITE_* come from here, not from the Vercel project: Vite inlines
      # them at build time, and keeping them in one place means changing the
      # backend URL is one edit rather than two that can disagree.
      - run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          # Printed on the two legal pages. Absent, they say so rather than
          # showing a gap — which is why preflight does not gate on it: a
          # missing contact address is not a reason to refuse to publish.
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}

      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  # Deploys unconditionally. There used to be a step that asked whether
  # `apps-script/` had changed and skipped the rest if it had not, and it was
  # wrong in a way that is invisible: it compared HEAD against HEAD^, which is
  # the last commit of a push and not the push. A merge that brought two commits
  # to main — one touching apps-script/, one not — reported "unchanged" and
  # skipped, in green, and the backend silently stayed a version behind.
  #
  # Getting the range right is harder than it looks: this workflow is triggered
  # by workflow_run, which carries the head of the push but not what preceded
  # it, so there is nothing to diff against without keeping state somewhere.
  # Pushing every time costs a few seconds and one Apps Script version per push
  # to main, including the doc-only ones. That is the accepted price, and it is
  # the tradeoff the old comment already claimed to be making: erring towards an
  # unnecessary push is harmless, erring the other way ships an app talking to
  # yesterday's backend.
  backend:
    needs: preflight
    if: needs.preflight.outputs.clasp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # CLASPRC_JSON is the contents of ~/.clasprc.json after `clasp login` on a
      # machine with a browser. It holds a refresh token: rotate it if it leaks,
      # and expect to redo it if it is ever revoked.
      #
      # Written through the environment rather than interpolated into the script:
      # a secret pasted straight into a shell command is one stray quote away
      # from being executed instead of stored.
      - name: Restore the clasp session
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ vars.SCRIPT_ID }}
        run: |
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"./apps-script"}' "$SCRIPT_ID" > .clasp.json

      # clasp answers every problem with this file the same way: "Could not read
      # API credentials. Are you logged in globally?" — which sends the reader
      # looking for a login that is missing when what is actually wrong is the
      # secret's content. So say what arrived, without echoing any of it: a byte
      # count and the top-level key names are enough to tell an empty paste from
      # a truncated one from a session written by the wrong major version of
      # clasp, and none of the three is a credential.
      - name: Check the clasp session is the shape clasp 2 reads
        run: |
          node -e '
            const fs = require("fs");
            const path = process.env.HOME + "/.clasprc.json";
            const raw = fs.readFileSync(path, "utf8");
            console.log("bytes: " + raw.length);
            let parsed;
            try {
              parsed = JSON.parse(raw);
            } catch (err) {
              console.error("Not JSON: " + err.message);
              console.error("CLASPRC_JSON did not survive the trip. Check the heredoc in terraform.tfvars.");
              process.exit(1);
            }
            const keys = Object.keys(parsed);
            console.log("top-level keys: " + keys.join(", "));
            if (parsed.token && parsed.token.refresh_token) {
              console.log("clasp 2 session, refresh token present");
            } else if (parsed.tokens) {
              console.error("This is a clasp 3 session — a `tokens` map rather than a `token` object.");
              console.error("The steps below run clasp 2, which will not read it. Redo `clasp login`");
              console.error("with @google/clasp@2 and put the new ~/.clasprc.json in terraform.tfvars.");
              process.exit(1);
            } else {
              console.error("Neither a `token` object nor a `tokens` map. Not a clasp session at all.");
              process.exit(1);
            }
          '

      - name: Push and redeploy
        env:
          DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}
        run: |
          npx --yes @google/clasp@2 push --force
          # Updating the existing deployment keeps the /exec URL stable. Creating
          # a new one would hand out a different URL and leave both phones
          # talking to a version nobody updates again.
          npx --yes @google/clasp@2 deploy --deploymentId "$DEPLOYMENT_ID" --description "$GITHUB_SHA"
